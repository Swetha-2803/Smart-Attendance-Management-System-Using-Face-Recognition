{% extends 'base.html' %}

{% block title %}Login - Smart Attendance Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-lock fa-2x"></i>
                    </div>
                    <h3 class="fw-bold" style="color: var(--primary-blue);">Welcome Back</h3>
                    <p class="text-muted">Sign in to your account</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-4 position-relative">
                        <label for="username" class="form-label fw-semibold">Username / Roll No</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 py-2" id="username" name="username" placeholder="Enter your username" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4 position-relative">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control bg-light border-start-0 py-2" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 px-3 mb-4 rounded-3 text-center" role="alert">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid username or password.
                        </div>
                    {% endif %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-bold shadow-sm">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Login
                        </button>
                    </div>
                    <input type="hidden" name="next" value="{{ next|default:'' }}">
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3 border-0 rounded-bottom-4">
                <small class="text-muted">Smart Attendance Pro System</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
